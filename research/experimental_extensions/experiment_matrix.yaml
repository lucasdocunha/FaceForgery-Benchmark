schema: faceforgery-experimental-matrix-v1
status: draft pending completed pilots and frozen candidate selection
canonical_seeds:
- 42
- 123
- 2024
- 7
- 2025
operator_guide: research/experimental_extensions/SERVER_RUNBOOK.md
source_environment:
- TCC_TRAIN_MANIFEST
- TCC_VAL_MANIFEST
- TCC_TRAIN_ROOT
- TCC_VAL_ROOT
- TCC_PRETRAINED_ROOT
- TCC_MODELS_ROOT
- TCC_DATA_ROOT
- TCC_EXPERIMENT_ROOT
- TCC_RUN_DIR
- TCC_SEED
common_evaluation_environment:
- TCC_EVAL_MODEL
- TCC_EVAL_CALIBRATION
- TCC_OUTPUT_ROOT
- TCC_SUITE_OUTPUT
- TCC_CALIBRATION_DIR
instructions:
- 'Set TCC_RUN_DIR from each row and choose one canonical TCC_SEED. Respect that row seed_scope: metric/graph keep
  the pretrained extractor fixed, while SBI/reconstruction use matching upstream seed conditions.'
- Set TCC_EVAL_MODEL=$TCC_RUN_DIR and TCC_EVAL_CALIBRATION=$TCC_CALIBRATION_DIR/calibration.json after calibration.
- Use the single suite_command for all four targets and paired Test/Test-D uncertainty.
- Optional separate_suite_commands require the runbook split-config preparation; choose a fresh separate output
  and do not execute the same populations twice.
- Each variants value is a separate recorded condition with its own output; do not launch the entire exploratory
  graph grid without source-validation screening.
- All source/cache/target paths must be certified; missing dependencies/assets fail explicitly.
- Preserve exact implementation snapshot with the artifacts because bundle guards reject changed code.
evaluation_protocols:
  test:
    environment:
    - TCC_EVAL_TEST_MANIFEST
    - TCC_EVAL_TEST_ROOT
    unit: image
    threshold: frozen source validation
  test_d:
    environment:
    - TCC_EVAL_TEST_D_MANIFEST
    - TCC_EVAL_TEST_D_ROOT
    unit: image
    pairing: same IDs,labels,groups as Test
  df40:
    environment:
    - TCC_EVAL_DF40_MANIFEST
    - TCC_EVAL_DF40_ROOT
    unit: image plus technique/paradigm
    real_reference_policy: pooled_all_real
    limitation: legacy comparable; source-domain confounded; cdf/frames overlaps Celeb-DF source
  celeb_df_v2:
    environment:
    - TCC_EVAL_CELEB_MANIFEST
    - TCC_EVAL_CELEB_ROOT
    unit: video mean frame p_fake
    polarity: official1real explicitly converted to internal1fake
    coverage: official518testvideos
experiments:
- name: sbi-hf-dino-srm
  priority: 1
  server_reason: Highest-priority conditional cross-dataset study; retain unadapted checkpoint and simple SRM fusion
    as controls.
  family: sbi
  architecture: dino verified pretrained SRM backbone
  regime: SBI adaptation after MFFI fake exposure
  input_representation: 224px normalized RGB plus exact legacy3SRM filters
  seeds:
  - 42
  - 123
  - 2024
  - 7
  - 2025
  dataset:
    fit: MFFI phase-1 certified train; real-only where specified
    selection: MFFI certified val; deterministic val_fit/val_select for fusion
    targets:
    - Test
    - Test-D
    - DF-40
    - Celeb-DF v2
  checkpoint_source: lucasoc/MFFI-Models dino/srm/finetune_robust matching seed; original run_config.json required
  config: configs/experimental/sbi_hf_adaptation.yaml
  environment:
    TCC_SBI_INIT_CHECKPOINT: ${TCC_MODELS_ROOT}/dino/srm/finetune_robust/seed_${TCC_SEED}/weights/best.pth
  run_directory: ${TCC_EXPERIMENT_ROOT}/sbi-hf-dino-srm/seed_${TCC_SEED}
  train_command: python research_cli.py experimental train --family sbi --config configs/experimental/sbi_hf_adaptation.yaml
    --seed "$TCC_SEED" --output "$TCC_RUN_DIR" --device cuda --execute
  calibrate_command: python research_cli.py experimental calibrate --family sbi --run "$TCC_RUN_DIR" --manifest
    "$TCC_VAL_MANIFEST" --root "$TCC_VAL_ROOT" --output "$TCC_CALIBRATION_DIR" --device cuda --threshold-policy
    youden --execute
  suite_config: configs/experimental/suites/sbi.yaml
  suite_command: python research_cli.py experimental evaluate --config configs/experimental/suites/sbi.yaml --output
    "$TCC_SUITE_OUTPUT" --device cuda --execute
  separate_suite_commands:
    test: python research_cli.py experimental evaluate --config "$TCC_SPLIT_CONFIG_DIR/test.yaml" --device cuda
      --execute
    test_d: python research_cli.py experimental evaluate --config "$TCC_SPLIT_CONFIG_DIR/test_d.yaml" --device cuda
      --execute
    df40: python research_cli.py experimental evaluate --config "$TCC_SPLIT_CONFIG_DIR/df40.yaml" --device cuda
      --execute
    celeb_df_v2: python research_cli.py experimental evaluate --config "$TCC_SPLIT_CONFIG_DIR/celeb_df_v2.yaml"
      --device cuda --execute
  expected_outputs:
    training: '${TCC_RUN_DIR}: run configuration, provenance, checkpoint/inventory, telemetry, validation predictions,
      calibration and metrics'
    calibration: ${TCC_CALIBRATION_DIR}/calibration.json
    evaluation:
    - ${TCC_SUITE_OUTPUT}/test
    - ${TCC_SUITE_OUTPUT}/test_d
    - ${TCC_SUITE_OUTPUT}/df40
    - ${TCC_SUITE_OUTPUT}/celeb_df_v2
  seed_scope: matching upstream seed and downstream realization, subject to verified controlled-condition equality
