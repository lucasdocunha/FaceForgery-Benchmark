      --execute
    df40: python research_cli.py experimental evaluate --config "$TCC_SPLIT_CONFIG_DIR/df40.yaml" --device cpu --execute
    celeb_df_v2: python research_cli.py experimental evaluate --config "$TCC_SPLIT_CONFIG_DIR/celeb_df_v2.yaml"
