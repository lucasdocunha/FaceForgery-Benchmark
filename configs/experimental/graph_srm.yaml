family: graph
run_dir: ${TCC_RUN_DIR}
seed: ${TCC_SEED}
caches:
  train: ${TCC_TRAIN_CACHE}
  val: ${TCC_VAL_CACHE}
model:
  kind: ${TCC_GRAPH_KIND}
  protocol: inductive
  label_fraction: ${TCC_LABEL_FRACTION}
  backend: pyg
  standardize: true
  hidden_dim: 32
  projection_dim: 128
  dropout: 0.1
  fanouts: [10, 5]
  graph:
    backend: faiss
    memory_budget_mb: 4096
    hnsw_m: 16
    ef_search: 128
    exact_limit: 10000
    k: 10
    policy: directed
    dynamic: false
    rebuild_interval: 5
    noise_fraction: 0.0
    alpha: 0.8
    iterations: 50
training:
  device: ${TCC_DEVICE}
  cpu_threads: 2
  epochs: 30
  early_stop_patience: 5
  batch_size: 32
  inference_batch_size: 32
  baseline_epochs: 30
  lr: 0.001
  weight_decay: 0.0001
