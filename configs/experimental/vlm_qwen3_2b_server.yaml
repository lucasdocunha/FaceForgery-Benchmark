task: vlm
name: qwen3vl2b_nf4_qlora
scope: full-benchmark-server
seed: 42
output_dir: ${TCC_RUN_DIR}
data:
  train_manifest: ${TCC_TRAIN_MANIFEST}
  val_manifest: ${TCC_VAL_MANIFEST}
  train_root: ${TCC_TRAIN_ROOT}
  val_root: ${TCC_VAL_ROOT}
model:
  model_id: Qwen/Qwen3-VL-2B-Instruct
  revision: 89644892e4d85e24eaac8bacfd4f463576704203
  model_type: qwen3_vl
  pretrained_path: ${TCC_PRETRAINED_ROOT}/Qwen3-VL-2B-Instruct
