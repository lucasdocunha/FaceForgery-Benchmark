training:
  device: cuda
  amp: true
  cpu_threads: 2
  workers: 0
  batch_size: 1
  eval_batch_size: 1
  grad_accum_steps: 16
  epochs: 3
  lr: 0.0001
  weight_decay: 0.01
  max_grad_norm: 1.0
  threshold_policy: youden
