# Genuine-only AE; source validation chooses reconstruction quality.
task: ae
name: reconstruction-gated-pilot
seed: 42
output_dir: ${TCC_RUN_DIR}
data:
  train_manifest: ${TCC_TRAIN_MANIFEST}
  val_manifest: ${TCC_VAL_MANIFEST}
  train_root: ${TCC_TRAIN_ROOT}
  val_root: ${TCC_VAL_ROOT}
model:
  ae:
    kind: gated
    image_size: 128
    width: 8
    latent_dim: 32
    skip_divisor: 8
training:
  epochs: 3
  batch_size: 8
  workers: 0
  grad_accum_steps: 1
  amp: true
  lr_ae: 0.001
  weight_decay: 0.0001
  recipe: basic_v1
  early_stop_patience: 4
  plots: true
  threshold_policy: youden
  loss:
    lambda_ssim: 0.1
    lambda_lpips: 0
    kl_reduction: mean_per_dim
    beta:
      kind: linear
      maximum: 0.0
      warmup_steps: 24
