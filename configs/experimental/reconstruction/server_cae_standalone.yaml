# Genuine-only AE; source validation chooses reconstruction quality.
# Standalone edition: Uses SSIM + L1/L2 reconstruction without external LPIPS weights.
task: ae
name: reconstruction-cae-server
seed: 42
output_dir: ${TCC_RUN_DIR}
data:
  train_manifest: ${TCC_TRAIN_MANIFEST}
  val_manifest: ${TCC_VAL_MANIFEST}
  train_root: ${TCC_TRAIN_ROOT}
  val_root: ${TCC_VAL_ROOT}
model:
  ae:
    kind: cae
    image_size: 224
    width: 32
    latent_dim: 128
    skip_divisor: 8
training:
  epochs: 30
  batch_size: 32
  workers: 4
  grad_accum_steps: 2
  amp: true
  lr_ae: 0.001
  weight_decay: 0.0001
  recipe: basic_v1
  early_stop_patience: 8
  plots: true
  threshold_policy: youden
  loss:
    lambda_ssim: 0.1
    lambda_lpips: 0.0
    kl_reduction: mean_per_dim
    beta:
      kind: linear
      maximum: 0.0
      warmup_steps: 5000
