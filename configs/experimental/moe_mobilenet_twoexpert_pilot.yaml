# Structural ablation before the reconstruction expert is available.
task: moe
name: mobilenet_srm_rgb_soft_twoexpert_ablation
scope: min-dataset-development-twoexpert-ablation
seed: 42
output_dir: ${TCC_MODELS_ROOT}/experimental/moe_mobilenet_twoexpert/seed_42
data:
  experts:
    - {name: srm, role: srm, kind: feature_cache, path: '${TCC_FEATURE_SRM_VAL}'}
    - {name: rgb, role: rgb, kind: feature_cache, path: '${TCC_FEATURE_RGB_VAL}'}
  required_roles: [srm, rgb]
  split_seed: 42
  fit_fraction: 0.5
model:
  hidden_dim: 32
  train_routing: soft
  expert_dropout: 0.1
training:
  device: cpu
  amp: false
  cpu_threads: 2
  workers: 0
  epochs: 6
  batch_size: 32
  lr: 0.001
  early_stop_patience: 4
