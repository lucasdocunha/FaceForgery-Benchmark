# Adaptation after MFFI fake exposure. This is not a clean unseen-forgery proxy.
name: sbi-hf-mobilenet-srm
seed: 42
output_dir: ${TCC_EXPERIMENT_ROOT}/sbi-hf/seed_42
data:
  train_manifest: ${TCC_DATA_ROOT}/certified/train.csv
  val_manifest: ${TCC_DATA_ROOT}/certified/val.csv
  train_root: ${TCC_DATASET_ROOT}/train
  val_root: ${TCC_DATASET_ROOT}/val
  landmarks: ${TCC_DATA_ROOT}/landmarks/train-real.sqlite
model:
  initialization: hf_mffi
  weights: ${TCC_MODELS_ROOT}/mobilenet/srm/finetune_robust/seed_42/weights/best.pth
  mode: srm
  image_size: 224
  train_backbone: true
training:
  arm: sbi
  epochs: 5
  batch_size: 16
  grad_accum_steps: 4
  workers: 4
  lr_backbone: 0.00001
  lr_head: 0.0001
  amp: true
  failure_policy: error
  cache_images: false
