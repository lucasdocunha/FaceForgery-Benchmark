# Primary mixed SBI/MFFI adaptation after prior fake exposure; retain unadapted controls.
name: sbi-hf-mixed-adaptation
seed: 42
output_dir: ${TCC_RUN_DIR}
data:
  train_manifest: ${TCC_TRAIN_MANIFEST}
  val_manifest: ${TCC_VAL_MANIFEST}
  train_root: ${TCC_TRAIN_ROOT}
  val_root: ${TCC_VAL_ROOT}
  landmarks: ${TCC_DATA_ROOT}/landmarks/train-real.sqlite
model:
  initialization: hf_mffi
  weights: ${TCC_SBI_INIT_CHECKPOINT}
  mode: srm
  image_size: 224
  train_backbone: true
training:
  arm: mixed
  epochs: 5
  batch_size: 16
  grad_accum_steps: 4
  workers: 4
  lr_backbone: 0.00001
  lr_head: 0.0001
  amp: true
  failure_policy: exclude
  cache_images: false
