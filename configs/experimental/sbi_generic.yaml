# Same initialization, seed and update budget across sbi, mffi and mixed arms.
name: sbi-generic-${TCC_SBI_ARM}
seed: 42
output_dir: ${TCC_RUN_DIR}
data:
  train_manifest: ${TCC_TRAIN_MANIFEST}
  val_manifest: ${TCC_VAL_MANIFEST}
  train_root: ${TCC_TRAIN_ROOT}
  val_root: ${TCC_VAL_ROOT}
  landmarks: ${TCC_DATA_ROOT}/landmarks/train-real.sqlite
model:
  architecture: mobilenet_v3_large
  initialization: imagenet
  weights: ${TCC_PRETRAINED_ROOT}/mobilenet_v3_large-5c1a4163.pth
  mode: srm
  image_size: 224
  train_backbone: true
training:
  arm: ${TCC_SBI_ARM}
  epochs: 10
  early_stop_patience: 11
  batch_size: 32
  grad_accum_steps: 2
  workers: 4
  lr_backbone: 0.0001
  lr_head: 0.001
  amp: true
  failure_policy: exclude
  cache_images: false
  mask:
    forehead_extension: 0.0
