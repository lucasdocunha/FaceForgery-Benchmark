name: Explicability evidence recovery
on:
  push:
    branches: [explicability]
    paths: ['.github/workflows/explicability-recovery.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    if: github.ref == 'refs/heads/explicability'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Recover narrowly scoped public assets
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib, urllib.request, urllib.parse, time
          spec = importlib.util.spec_from_file_location('fetcher', 'scripts/fetch_explicability_evidence.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          out = pathlib.Path('/tmp/recovery'); out.mkdir(parents=True, exist_ok=True)
          status = []
          hub_url = f'https://huggingface.co/api/models/{m.HF_REPO}/revision/{m.HF_REVISION}'
          with urllib.request.urlopen(hub_url, timeout=60) as r: hub = json.load(r)
          base = f'https://huggingface.co/{m.HF_REPO}/resolve/{m.HF_REVISION}/'
          for item in hub['siblings']:
              name = item['rfilename']; parts = name.split('/')
              meta = parts[-1] in {'run_config.json','metrics_val.csv','metrics_test.csv','metrics_test_d.csv'}
              pred = (len(parts) == 6 and parts[1:3] == ['none','finetune'] and parts[3] in {'seed_42','seed_123','seed_2024'} and parts[-1] in {'predictions_val.csv','predictions_test.csv','predictions_test_d.csv'})
              if name.startswith('xception/') and (meta or pred):
                  status.append(m.download(base + name, out/'released'/name))
                  time.sleep(0.15)
          weight = 'resnet/none/finetune/seed_42/weights/best.pth'
          status.append(m.download(base + weight, out/'released'/weight))
          urls = {
            'modelscope_phase2_tree.json': 'https://www.modelscope.cn/api/v1/datasets/DDLteam/MFFI/repo/tree?Revision=master&Root=phase2&Recursive=False&PageNumber=1&PageSize=100',
            'modelscope_oss_tree.json': 'https://www.modelscope.cn/api/v1/datasets/DDLteam/MFFI/oss/tree/?Revision=master&Prefix=&MaxKeys=20',
            'resnet_weight_tree.json': f'https://huggingface.co/api/models/{m.HF_REPO}/tree/{m.HF_REVISION}/resnet/none/finetune/seed_42/weights',
          }
          for name, url in urls.items(): status.append(m.download(url, out/name))
          # Bounded public first-MiB probe: no full 24GB dataset download.
          for name, url in {
            'modelscope_range_probe': 'https://www.modelscope.cn/api/v1/datasets/DDLteam/MFFI/repo?Revision=master&FilePath=phase1.tar.gz',
          }.items():
              t = time.monotonic()
              try:
                  req = urllib.request.Request(url, headers={'Range':'bytes=0-1048575'})
                  with urllib.request.urlopen(req, timeout=60) as r:
                      data = r.read(1048576)
                      info = {'ok':True,'status':r.status,'headers':dict(r.headers),'bytes':len(data),'elapsed_seconds':time.monotonic()-t}
                  (out/(name+'.bin')).write_bytes(data)
              except Exception as e: info = {'ok':False,'error':str(e),'elapsed_seconds':time.monotonic()-t}
              (out/(name+'.json')).write_text(json.dumps(info,indent=2))
          (out/'downloads.json').write_text(json.dumps(status,indent=2))
          print('successful',sum(s['ok'] for s in status),'of',len(status))
          PY
      - name: Offline dependency compatibility wheels
        if: always()
        run: pip download --no-deps --dest /tmp/recovery/wheels safetensors==0.8.0 regex==2026.9.10
      - name: Source snapshot
        if: always()
        run: git archive HEAD -o /tmp/recovery/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicability-recovered-evidence
          path: /tmp/recovery/
          retention-days: 3
          if-no-files-found: error
