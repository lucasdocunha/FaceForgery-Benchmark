name: Explicability lightweight contracts
on:
  push:
    branches: [explicability]
    paths: ['src/explicability/**', 'tests/explicability/**', 'explicability.py', 'configs/explicability.yaml', 'requirements-explicability.txt', '.github/workflows/explicability-contracts.yml']
  pull_request:
    branches: [ICLR]
    paths: ['src/explicability/**', 'tests/explicability/**', 'explicability.py', 'configs/explicability.yaml', 'requirements-explicability.txt', '.github/workflows/explicability-contracts.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: explicability-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  synthetic-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax only
        run: python -m compileall -q src/explicability tests/explicability explicability.py
      - name: CPU dependency environment
        run: |
          python -m pip install 'torch==2.5.1+cpu' 'torchvision==0.20.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy==2.4.4' 'pandas==3.0.2' 'scikit-learn==1.8.0' 'matplotlib==3.10.8' 'pyyaml==6.0.3' 'timm==1.0.27' 'transformers==5.14.1' 'seaborn==0.13.2' 'captum==0.9.0'
      - name: Tiny CPU contracts, maximum three minutes
        run: |
          set -o pipefail
          timeout 180s python -m unittest discover -s tests/explicability -v 2>&1 | tee explicability-contracts.txt
          python explicability.py --help
          python -m pip freeze > explicability-check-environment.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicability-lightweight-checks
          path: |
            explicability-contracts.txt
            explicability-check-environment.txt
          retention-days: 7
          if-no-files-found: warn
