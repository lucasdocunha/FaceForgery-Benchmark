name: Robust generalization CPU checks
on:
  push:
    branches: [robust-generalization]
    paths: ['src/**', 'tests/**', 'research_cli.py', 'evaluate_celeb_df.py', 'scripts/prepare_celeb_df.py', 'configs/research/**', 'requirements-research.txt', 'research/robustness/**', '.github/workflows/research-checks.yml']
  pull_request:
    branches: [ICLR]
    paths: ['src/**', 'tests/**', 'research_cli.py', 'evaluate_celeb_df.py', 'scripts/prepare_celeb_df.py', 'configs/research/**', 'requirements-research.txt', 'research/robustness/**', '.github/workflows/research-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    if: github.repository == 'Lucas-PG/FaceForgery-Benchmark'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Record source identity without repackaging datasets and figures
        run: |
          mkdir -p /tmp/research-checks
          git rev-parse HEAD > /tmp/research-checks/commit.txt
          git archive HEAD src/robustness tests/robustness research_cli.py scripts/prepare_celeb_df.py evaluate_celeb_df.py configs/research -o /tmp/research-checks/code.tar
      - name: Install isolated CPU verification environment
        run: |
          python -m pip install -q 'torch==2.6.0+cpu' 'torchvision==0.21.0+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q -r requirements-research.txt
          python -m pip check
          python -m pip freeze > /tmp/research-checks/environment.txt
      - name: Bounded complete software suite; no benchmark experiments
        run: |
          set -o pipefail
          python -m compileall -q src scripts tests research_cli.py evaluate_celeb_df.py
          timeout 240s python -m pytest tests -q --import-mode=importlib --junitxml=/tmp/research-checks/junit.xml 2>&1 | tee /tmp/research-checks/tests.txt
          python research_cli.py --help
          python -m src.robustness.explain --help
          python evaluate_celeb_df.py --help
          python scripts/prepare_celeb_df.py --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-cpu-checks
          path: /tmp/research-checks/
          retention-days: 14
          if-no-files-found: error
