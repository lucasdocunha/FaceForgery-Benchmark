name: CISIA HPC checks
on:
  push:
    branches: [fix/cisia-hpc-readiness]
  pull_request:
    branches: [ICLR]
    paths: ['src/**', 'scripts/**', 'tests/**', 'train.py', 'run_matrix.py', 'requirements-cisia.txt', '.github/workflows/cisia-hpc.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cisia-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record source identity
        run: |
          git rev-parse HEAD > cisia-commit.txt
          git ls-files -s > cisia-files.txt
      - name: Install matched CPU verification environment
        run: |
          python -m pip install 'torch==2.10.0' 'torchvision==0.25.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-cisia.txt
          python -m pip check
      - name: Python and shell syntax
        run: |
          python -m compileall -q src scripts tests train.py run_matrix.py
          for file in scripts/cisia_common.sh scripts/slurm*.sh scripts/*pretrained_cisia.sh scripts/submit_all*cisia.sh; do
            bash -n "$file"
          done
      - name: CPU tests (no SLURM jobs, datasets or model downloads)
        run: |
          set -o pipefail
          timeout 600s python -m pytest tests -q --import-mode=importlib --junitxml=cisia-junit.xml 2>&1 | tee cisia-tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cisia-cpu-test-results
          path: |
            cisia-junit.xml
            cisia-tests.txt
            cisia-commit.txt
            cisia-files.txt
          retention-days: 14
