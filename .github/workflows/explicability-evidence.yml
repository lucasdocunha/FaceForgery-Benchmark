name: Explicability released-evidence collection
on:
  push:
    branches: [explicability]
    paths: ['.github/workflows/explicability-evidence.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    if: github.ref == 'refs/heads/explicability'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Collect pinned run evidence
        run: python scripts/fetch_explicability_evidence.py --output /tmp/evidence --rgb-predictions
      - name: Collect reference sources and dataset-access metadata
        if: always()
        run: |
          python - <<'PY'
          import importlib.util, json, pathlib
          spec = importlib.util.spec_from_file_location('fetcher', 'scripts/fetch_explicability_evidence.py')
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          out = pathlib.Path('/tmp/evidence/references')
          urls = {
            'original_source.tar': 'https://arxiv.org/src/2609.01511',
            'iclr2027-style.zip': 'https://media.iclr.cc/Conferences/ICLR2027/iclr-2027-style-files.zip',
            'modelscope_dataset.json': 'https://www.modelscope.cn/api/v1/datasets/DDLteam/MFFI',
            'modelscope_tree.json': 'https://www.modelscope.cn/api/v1/datasets/DDLteam/MFFI/repo/tree?Revision=master&Root=&Recursive=False&PageNumber=1&PageSize=100',
            'modelscope_api.py': 'https://raw.githubusercontent.com/modelscope/modelscope/master/modelscope/hub/api.py',
          }
          status = [m.download(url, out / name) for name, url in urls.items()]
          (out / 'status.json').write_text(json.dumps(status, indent=2))
          print(json.dumps(status, indent=2))
          PY
      - name: Download portable dependencies for offline CPU validation
        if: always()
        run: |
          mkdir -p /tmp/evidence/wheels
          pip download --no-deps --dest /tmp/evidence/wheels captum==0.9.0 timm==1.0.27 transformers==5.14.1 tokenizers==0.22.2 regex ftfy
      - name: Include source version
        if: always()
        run: git archive HEAD -o /tmp/evidence/source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: explicability-released-evidence
          path: /tmp/evidence/
          retention-days: 3
          if-no-files-found: error
