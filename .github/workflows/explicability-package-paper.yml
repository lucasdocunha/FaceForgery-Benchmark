name: Package ten-page reference only
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Explicability paper build run ID
        required: true
        default: '34621541196'
      built_commit:
        description: Exact source commit used by that reference build
        required: true
        default: 'd0bd4a78b084e78b2ea537e74b840f7933e843bc'
permissions:
  contents: read
concurrency:
  group: explicability-package-reference
  cancel-in-progress: false
jobs:
  package:
    if: github.ref == 'refs/heads/explicability'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    env:
      BUILD_RUN: ${{ inputs.build_run_id }}
      BUILT_COMMIT: ${{ inputs.built_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: explicability
          fetch-depth: 0
      - name: Validate reference build identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          run, commit = os.environ['BUILD_RUN'], os.environ['BUILT_COMMIT']
          if not run.isdigit() or not re.fullmatch('[0-9a-f]{40}', commit):
              raise ValueError('Invalid build identifiers')
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run}"
          req = urllib.request.Request(url, headers={'Authorization': 'Bearer '+os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=30) as response: record = json.load(response)
          if (record['head_sha'] != commit or record['head_branch'] != 'explicability'
              or record['conclusion'] != 'success' or record['path'] != '.github/workflows/explicability-paper.yml'):
              raise ValueError('Unexpected reference build')
          PY
      - uses: actions/download-artifact@v4
        with:
          name: explicability-paper-review
          run-id: ${{ env.BUILD_RUN }}
          github-token: ${{ github.token }}
          path: /tmp/reference-review
      - name: Update reference files only
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          source = os.environ['BUILT_COMMIT']
          root, bundle = pathlib.Path('paper/explicability'), pathlib.Path('/tmp/reference-review')
          primary = pathlib.Path('paper.pdf').read_bytes()
          def h(data): return hashlib.sha256(data).hexdigest()
          hashes = {}
          for name in ['paper/explicability/main.tex', 'paper/explicability/references.bib']:
              built = subprocess.check_output(['git', 'show', f'{source}:{name}'])
              if pathlib.Path(name).read_bytes() != built: raise ValueError('Reference sources changed')
              hashes[name] = h(built)
          pdf, text = (bundle/'main.pdf').read_bytes(), (bundle/'main.txt').read_text()
          normalized = re.sub('[^a-z0-9]', '', text.lower())
          if not pdf.startswith(b'%PDF-') or 'publishedasaconferencepaper' in normalized:
              raise ValueError('Invalid or misleading reference PDF')
          (root/'main.pdf').write_bytes(pdf)
          (root/'main.txt').write_text(text)
          record = {'built_commit': source, 'build_run_id': int(os.environ['BUILD_RUN']),
                    'source_sha256': hashes, 'pdf_sha256': h(pdf),
                    'pages': len([p for p in text.split('\f') if p.strip()]),
                    'edition': 'long-form reference, not the primary paper',
                    'research_status': 'pre-execution revision; no new image XAI results',
                    'branch': 'explicability'}
          (root/'build.json').write_text(json.dumps(record, indent=2)+'\n')
          if pathlib.Path('paper.pdf').read_bytes() != primary: raise ValueError('Primary paper changed')
          PY
      - name: Commit reference files, never the primary paper
        run: |
          test "$GITHUB_REF" = refs/heads/explicability
          test "$(git branch --show-current)" = explicability
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f -- paper/explicability/main.pdf paper/explicability/main.txt paper/explicability/build.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'paper: refresh long-form reference without changing primary manuscript'
          git push origin HEAD:refs/heads/explicability
